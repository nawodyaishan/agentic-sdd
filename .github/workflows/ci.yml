name: CI

on:
  push:
    branches: ["main"]
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Verify dependencies
        run: make mod-verify

      - name: Tidy check
        run: make tidy-check

      - name: Vet
        run: make vet

      - name: Test
        run: make test

      - name: Cross-compile darwin/amd64 + darwin/arm64
        run: make build-darwin
