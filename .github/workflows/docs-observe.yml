name: Docs observe

# Feature 022 B7/T16 - read-only post-publish observation route (plan K5, AC-08).
#
# Why this file exists. Publication in this repository runs with the publishing
# workflow's own `GITHUB_TOKEN`, and GitHub starts no new workflow run for an
# event that a `GITHUB_TOKEN` created. The `release: published` trigger in
# `docs.yml` therefore cannot deliver an in-repo publication, and a reusable
# `workflow_call` cannot be added from here: `docs.yml`'s `deploy` job requests
# `pages: write` and `id-token: write`, so calling that workflow from a
# publisher that holds `contents: read` would fail at workflow startup. The
# publisher is deliberately not widened (owner decision 2026-11-18), so this
# separate `workflow_run` workflow is the in-repo route that reaches
# observation. `docs.yml`'s `workflow_call` entrypoint stays as-is for other,
# suitably-permissioned callers.
#
# Trust. GitHub takes a `workflow_run` workflow file from the default branch,
# never from the tag, so a tag cannot change this file, its permissions or the
# revision it chooses to observe. A `workflow_run` event is created by the
# platform for a completed run, not by a repository token, so token-created
# event suppression does not apply to it.
#
# Read-only and non-blocking. Workflow-level permissions are empty; the single
# job holds `contents: read` only. There are no secrets, no environment, no
# OIDC, no Pages scope and no publishing step, and no artifact is deployed or
# promoted. This is a separate run, so a failure here cannot delay, block or
# change the publish run that triggered it.
#
# What is observed, and what is not. `release-publish.yml` runs from the
# default branch, so its own `head_sha` is the branch head, not the released
# revision. The published revision is instead derived from the latest GitHub
# release through the read-only API: the tag must be a strict `vX.Y.Z` name, it
# must resolve to a full 40-hex commit, and that commit must be an ancestor of
# the default branch, or the job refuses to record anything. That release must
# also have been *published* inside the triggering publish run's own window (see
# the window check in the resolve step), so a stale `releases/latest` answer - a
# rerun of an older publish, or a publish whose release step was skipped while
# the run still concluded `success` - is refused instead of being recorded under
# this run's id. Only the publication time can serve as that binding: the API's
# `created_at` is the date of the tagged *commit*, which always predates the
# publish run that released it.
#
# What is written, exactly. Two records in the uploaded evidence directory, and
# nothing else: `binding.json` (`docs-observation-binding/1`: expected and
# observed revision of the checked-out commit) and `observation.json`
# (`docs-observation-route/1`, carrying `tag`, `tag_source:"latest-release"`,
# `source_run_id`, `observation_run_id`, `authoritative:false`,
# `blocking_release:false` and `artifact_identity:"not-inspected"`). There is no
# `identity.json`, unlike `docs.yml`'s `post-publish-observation` job:
# `docs-ci.py --action identity` records an adopted digest-pinned runtime image,
# and this route adopts no image, pulls nothing and runs no container. This
# observes a release identity, never a build artifact. Site publication, the
# retained artifact and the deployed-site observation stay with `docs.yml`'s
# `main-build`, `rollback` and `smoke` jobs.
#
# Chaining limit. GitHub delivers at most three levels of `workflow_run`
# chaining. This file is already the third level: a tag push starts "Release
# build", which triggers "Release publish", which triggers this workflow. A
# `workflow_run` trigger added on top of this file would be a fourth level and
# is not delivered, so a further observation must be recorded here (or reached
# another way) rather than chained past this point.
#
# Not verified live: no run of this workflow has executed. The delivery of the
# chain above and the exact API answers for the release and compare calls are
# `not_run` until an authorized live run; an absent artifact is never read as
# success or failure.

on:
  # A completed publish run. The workflow file is taken from the default branch,
  # so a tag cannot alter this observer, and only the run outcome is read.
  workflow_run:
    workflows: ["Release publish"]
    types: [completed]

# Baseline for every job; the single job restates its only scope.
permissions: {}

jobs:
  # ---------------------------------------------------------------------------
  # Observation reached by a completed publish run - read-only, no publication.
  # ---------------------------------------------------------------------------
  observe:
    name: Post-publish documentation observation (read-only, non-blocking)
    # Observe only a publish that concluded successfully. A failed or cancelled
    # publisher has no released revision to observe, and its own run already
    # carries the failure.
    if: github.event.workflow_run.conclusion == 'success'
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Resolve the released tag and commit (read-only)
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          # The triggering publish run's own window, passed as values so nothing
          # from the event payload is ever interpolated into this script.
          RUN_STARTED_AT: ${{ github.event.workflow_run.run_started_at }}
          RUN_UPDATED_AT: ${{ github.event.workflow_run.updated_at }}
        run: |
          set -euo pipefail
          # The latest release is the publication record this route observes.
          # Its tag is validated before any use, with the same strict pattern
          # `release-publish.yml` applies to the build run's branch: a branch
          # name, a shortened ref, a pre-release suffix or a decorated tag can
          # never become a checkout ref. The commit must be a full lowercase
          # SHA, and it must be reachable from the default branch, so a tag on a
          # side branch or an unrelated commit is refused rather than observed.
          # The tag comes from `releases/latest` as the API orders it, never
          # from this run (a publish run carries no tag input), so the
          # publication window check below is what ties it back to this publish
          # run. The record keeps `source_run_id` next to the tag so the pair
          # stays readable, and it remains non-authoritative.
          if [[ ! "${DEFAULT_BRANCH:-}" =~ ^[A-Za-z0-9][A-Za-z0-9._/-]*$ ]] || [[ "$DEFAULT_BRANCH" == *..* ]]; then
            echo "::error::default branch name is missing or unsafe; refusing to observe"
            exit 1
          fi

          # ------------------------------------------------------------------
          # Which release may this run observe? `releases/latest` answers with
          # one non-draft, non-prerelease release, and GitHub orders that answer
          # by `created_at` - the date of the *commit* the release points at,
          # not when the release was drafted or published. That commit predates
          # the publish run by construction, so `created_at` can never show that
          # a release belongs to this run; only its publication time can. The
          # window check below is therefore what binds the release to this run:
          # without it, a rerun of an older publish run - or a publish whose
          # release step was skipped while the run still concluded `success` -
          # would record the previous release under this run's id. Only a
          # release published inside the triggering run's own window is
          # accepted. The window starts at `run_started_at` with no allowance (a
          # release published before the run began is another run's), and ends
          # at the run's `updated_at` plus a documented 120 s slack for the
          # release call landing just after the run's final update. The
          # publication time must be present; `created_at` must also be present
          # and a UTC timestamp, but it is never compared with the window start,
          # because a genuine release always has a commit date before it.
          # ------------------------------------------------------------------
          ISO_UTC='^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}Z$'
          RELEASE_WINDOW_SLACK_SECONDS=120
          for name in RUN_STARTED_AT RUN_UPDATED_AT; do
            value="${!name:-}"
            if ! printf '%s' "$value" | grep -Eq "$ISO_UTC"; then
              echo "::error::${name} is missing or is not an ISO-8601 UTC timestamp; refusing to observe"
              exit 1
            fi
          done

          # Seconds since the epoch for one validated `YYYY-MM-DDTHH:MM:SSZ`
          # value, computed in the shell so the comparison does not depend on a
          # GNU-only `date -d`. Days-from-civil: the year is shifted to start in
          # March, which puts the leap day at the end of the shifted year and
          # makes the day-of-year formula uniform. `10#` keeps a leading zero
          # from being read as octal.
          epoch_seconds() {
            local stamp="$1" y mo d h mi s yy era yoe mp doy doe days
            y=$((10#${stamp:0:4})); mo=$((10#${stamp:5:2})); d=$((10#${stamp:8:2}))
            h=$((10#${stamp:11:2})); mi=$((10#${stamp:14:2})); s=$((10#${stamp:17:2}))
            yy=$y
            if (( mo <= 2 )); then yy=$((yy - 1)); fi
            era=$(( (yy >= 0 ? yy : yy - 399) / 400 ))
            yoe=$(( yy - era * 400 ))
            mp=$(( mo > 2 ? mo - 3 : mo + 9 ))
            doy=$(( (153 * mp + 2) / 5 + d - 1 ))
            doe=$(( yoe * 365 + yoe / 4 - yoe / 100 + doy ))
            days=$(( era * 146097 + doe - 719468 ))
            echo $(( days * 86400 + h * 3600 + mi * 60 + s ))
          }

          # Refuse, with the value named, when the release's publication time
          # falls outside the triggering run's window. `exit` here ends the
          # step, so no record is written by any later step.
          check_release_window() {
            local field="$1" stamp="$2" seconds
            seconds="$(epoch_seconds "$stamp")"
            if (( seconds < run_started )); then
              echo "::error::the latest release's ${field} (${stamp}) is before this publish run's start (${RUN_STARTED_AT}); refusing to observe another run's release"
              exit 1
            fi
            if (( seconds > window_end )); then
              echo "::error::the latest release's ${field} (${stamp}) is after this publish run's last update (${RUN_UPDATED_AT}) plus ${RELEASE_WINDOW_SLACK_SECONDS}s; refusing to observe another run's release"
              exit 1
            fi
          }

          # One read-only call, one answer: the tag and both timestamps come
          # from the same `releases/latest` document, so a release that lands
          # between two calls can never contribute its tag to one and its
          # timestamps to another. `gh`'s built-in jq prints each selector on
          # its own line, which is read as exactly three fields.
          release_fields_text="$(gh api "repos/${GH_REPO}/releases/latest" --jq '.tag_name, .published_at, .created_at')" || {
            echo "::error::cannot read the latest release; refusing to observe"
            exit 1
          }
          mapfile -t release_fields <<< "$release_fields_text"
          if (( ${#release_fields[@]} != 3 )); then
            echo "::error::the latest release did not answer with one tag and two timestamps; refusing to observe"
            exit 1
          fi
          tag="${release_fields[0]}"
          release_published_at="${release_fields[1]}"
          release_created_at="${release_fields[2]}"
          # Character set first, so a multi-line or decorated value cannot pass
          # the anchored pattern below one line at a time.
          case "$tag" in
            *[!A-Za-z0-9._-]*)
              echo "::error::the latest release tag contains characters this observation will not use; refusing to observe"
              exit 1
              ;;
          esac
          if ! printf '%s' "$tag" | grep -Eq '^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$'; then
            echo "::error::the latest release tag is not a strict vX.Y.Z tag; refusing to observe"
            exit 1
          fi

          # Both timestamps are read from that same answer; a null, absent or
          # non-UTC value refuses. Only `published_at` is then window-checked:
          # `created_at` is the tagged commit's date, which is older than the
          # run for every genuine release, so requiring it to fall inside the
          # window would refuse every release this route exists to observe.
          for stamp in "$release_published_at" "$release_created_at"; do
            if ! printf '%s' "$stamp" | grep -Eq "$ISO_UTC"; then
              echo "::error::the latest release has no usable published_at/created_at timestamp; refusing to observe"
              exit 1
            fi
          done
          run_started="$(epoch_seconds "$RUN_STARTED_AT")"
          window_end=$(( $(epoch_seconds "$RUN_UPDATED_AT") + RELEASE_WINDOW_SLACK_SECONDS ))
          check_release_window published_at "$release_published_at"

          # A lightweight tag points straight at a commit; an annotated tag
          # points at a tag object that must be dereferenced once. Anything else
          # (tree, blob, another annotated layer) is not a published commit.
          object_type="$(gh api "repos/${GH_REPO}/git/ref/tags/${tag}" --jq '.object.type')" || {
            echo "::error::cannot read the tag ref for ${tag}; refusing to observe"
            exit 1
          }
          object_sha="$(gh api "repos/${GH_REPO}/git/ref/tags/${tag}" --jq '.object.sha')" || {
            echo "::error::cannot read the tag object for ${tag}; refusing to observe"
            exit 1
          }
          revision="$object_sha"
          if [ "$object_type" = "tag" ]; then
            revision="$(gh api "repos/${GH_REPO}/git/tags/${object_sha}" --jq '.object.sha')" || {
              echo "::error::cannot dereference annotated tag ${tag}; refusing to observe"
              exit 1
            }
            commit_type="$(gh api "repos/${GH_REPO}/git/tags/${object_sha}" --jq '.object.type')" || commit_type=""
          else
            commit_type="$object_type"
          fi
          if [ "$commit_type" != "commit" ]; then
            echo "::error::tag ${tag} does not resolve to a commit (${commit_type:-unknown}); refusing to observe"
            exit 1
          fi
          if [[ ! "$revision" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::tag ${tag} does not resolve to a full lowercase commit SHA; refusing to observe"
            exit 1
          fi

          # Ancestry from the same read-only API: comparing the released commit
          # as the base against the default branch reports `ahead` (or
          # `identical`) only when the released commit is an ancestor of the
          # default branch. `behind`, `diverged` or any error refuses.
          status="$(gh api "repos/${GH_REPO}/compare/${revision}...${DEFAULT_BRANCH}" --jq '.status')" || {
            echo "::error::cannot compare ${revision} with ${DEFAULT_BRANCH}; refusing to observe"
            exit 1
          }
          case "$status" in
            ahead|identical) ;;
            *)
              echo "::error::released commit ${revision} is not on the default branch ${DEFAULT_BRANCH} (${status:-unknown}); refusing to observe"
              exit 1
              ;;
          esac

          echo "RESOLVED_TAG=${tag}" >> "$GITHUB_ENV"
          echo "RESOLVED_REVISION=${revision}" >> "$GITHUB_ENV"
          echo "Released revision: ${tag} ${revision}"

      - name: Checkout the published revision
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4, same pin as ci.yml
        with:
          ref: ${{ env.RESOLVED_REVISION }}
          path: docs-trusted
          fetch-depth: 1
          submodules: false
          persist-credentials: false

      - name: Bind the observation to the published revision
        env:
          TRUSTED_DIR: ${{ github.workspace }}/docs-trusted
          REVISION: ${{ env.RESOLVED_REVISION }}
          OUT_DIR: ${{ runner.temp }}/docs-ci/observe
          HOME: ${{ runner.temp }}/docs-ci/home-observe
          GIT_CONFIG_NOSYSTEM: "1"
          GIT_CONFIG_GLOBAL: /dev/null
        run: |
          set -euo pipefail
          # Same binding record and refusal as `docs.yml`'s
          # `post-publish-observation` job: the record is written before the
          # verdict, so a mismatch is still evidence, and the step fails loudly
          # instead of recording an observation of a different source.
          install -d -m 0700 "$OUT_DIR" "$HOME"
          observed="$(git -C "$TRUSTED_DIR" rev-parse HEAD)"
          if [ "$observed" = "$REVISION" ]; then
            matched=true
          else
            matched=false
          fi
          printf '{"schema":"docs-observation-binding/1","expected_revision":"%s","observed_revision":"%s","matched":%s}\n' \
            "$REVISION" "$observed" "$matched" > "$OUT_DIR/binding.json"
          if [ "$matched" != "true" ]; then
            echo "::error::checked-out $observed does not match the published revision $REVISION; refusing to observe a different source"
            exit 1
          fi

      - name: Record the delivery route of this observation
        env:
          OUT_DIR: ${{ runner.temp }}/docs-ci/observe
          OBSERVATION_ROUTE: workflow-run
          OBSERVATION_DELIVERY: post-publish-run-event
          OBSERVATION_RUN_ID: ${{ github.run_id }}
          REVISION: ${{ env.RESOLVED_REVISION }}
          PUBLISHED_TAG: ${{ env.RESOLVED_TAG }}
          SOURCE_RUN_ID: ${{ github.event.workflow_run.id }}
          # Where the tag came from: this route can only read `releases/latest`,
          # never a tag supplied by the triggering run, so the record says so
          # next to the tag it carries.
          TAG_SOURCE: latest-release
        run: |
          set -euo pipefail
          # Same record schema, field set and refusal rules as `docs.yml`'s
          # `post-publish-observation` job, plus `tag_source`. The values are
          # revalidated here because this step is the one that writes them.
          install -d -m 0700 "$OUT_DIR"
          # Every value below is interpolated into one single-line JSON record,
          # so a character outside the documented sets is refused before it can
          # break the record or smuggle a second line into it.
          case "$REVISION$OBSERVATION_RUN_ID$SOURCE_RUN_ID${PUBLISHED_TAG:-}${TAG_SOURCE:-}" in
            *[!A-Za-z0-9._+-]*)
              echo "::error::an observation identifier contains a character this record will not store"
              exit 1
              ;;
          esac
          if ! printf '%s' "$REVISION" | grep -Eq '^[0-9a-f]{40}$'; then
            echo "::error::refusing to record a revision that is not a full commit SHA"
            exit 1
          fi
          if ! printf '%s' "$OBSERVATION_RUN_ID" | grep -Eq '^[0-9]{1,20}$'; then
            echo "::error::refusing to record a non-numeric observation run id"
            exit 1
          fi
          if ! printf '%s' "$SOURCE_RUN_ID" | grep -Eq '^[0-9]{1,20}$'; then
            echo "::error::refusing to record a non-numeric publish run id"
            exit 1
          fi
          tag="${PUBLISHED_TAG:-}"
          if ! printf '%s' "$tag" | grep -Eq '^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$'; then
            echo "::error::the released tag is not a strict vX.Y.Z tag this record will store"
            exit 1
          fi
          # The only tag derivation this route performs is the newest release,
          # so any other value here is a change that must be made deliberately.
          if ! printf '%s' "${TAG_SOURCE:-}" | grep -Eq '^latest-release$'; then
            echo "::error::refusing to record a tag whose source this route does not declare as latest-release"
            exit 1
          fi
          # `route: workflow-run` is the event that survives here: a completed
          # publish run is observed by a default-branch workflow file. Nothing
          # was built, downloaded or deployed, so `artifact_identity` says
          # plainly that no build artifact was inspected.
          printf '{"schema":"docs-observation-route/1","route":"%s","delivery":"%s","event":"workflow_run","revision":"%s","tag":"%s","tag_source":"%s","source_run_id":"%s","observation_run_id":"%s","result":"observed","authoritative":false,"blocking_release":false,"artifact_identity":"not-inspected","source_binding":"binding.json"}\n' \
            "$OBSERVATION_ROUTE" "$OBSERVATION_DELIVERY" "$REVISION" "$tag" \
            "$TAG_SOURCE" "$SOURCE_RUN_ID" "$OBSERVATION_RUN_ID" > "$OUT_DIR/observation.json"

      - name: Upload post-publish observation evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4, same pin as ci.yml
        with:
          name: docs-post-publish-observation
          # Response only: `binding.json` is written before the verdict, so a
          # refused or mismatched source still leaves a record.
          path: ${{ runner.temp }}/docs-ci/observe
          if-no-files-found: warn
          retention-days: 7
