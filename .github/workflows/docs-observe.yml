name: Docs observe

# Feature 022 B7/T16 - read-only post-publish observation route (plan K5, AC-08).
#
# Why this file exists. Publication in this repository runs with the publishing
# workflow's own `GITHUB_TOKEN`, and GitHub starts no new workflow run for an
# event that a `GITHUB_TOKEN` created. The `release: published` trigger in
# `docs.yml` therefore cannot deliver an in-repo publication, and a reusable
# `workflow_call` cannot be added from here: `docs.yml`'s `deploy` job requests
# `pages: write` and `id-token: write`, so calling that workflow from a
# publisher that holds `contents: read` would fail at workflow startup. The
# publisher is deliberately not widened (owner decision 2026-11-18), so this
# separate `workflow_run` workflow is the in-repo route that reaches
# observation. `docs.yml`'s `workflow_call` entrypoint stays as-is for other,
# suitably-permissioned callers.
#
# Trust. GitHub takes a `workflow_run` workflow file from the default branch,
# never from the tag, so a tag cannot change this file, its permissions or the
# revision it chooses to observe. A `workflow_run` event is created by the
# platform for a completed run, not by a repository token, so token-created
# event suppression does not apply to it.
#
# Read-only and non-blocking. Workflow-level permissions are empty; the single
# job holds `contents: read` only. There are no secrets, no environment, no
# OIDC, no Pages scope and no publishing step, and no artifact is deployed or
# promoted. This is a separate run, so a failure here cannot delay, block or
# change the publish run that triggered it.
#
# What is observed, and what is not. `release-publish.yml` runs from the
# default branch, so its own `head_sha` is the branch head, not the released
# revision. The published revision is instead derived from the latest GitHub
# release through the read-only API: the tag must be a strict `vX.Y.Z` name, it
# must resolve to a full 40-hex commit, and that commit must be an ancestor of
# the default branch, or the job refuses to record anything. The job then checks
# out that commit and records the same route evidence shape as `docs.yml`'s
# `post-publish-observation` job (`docs-observation-route/1` plus
# `docs-observation-binding/1`), with `authoritative:false`,
# `blocking_release:false` and `artifact_identity:not-inspected`: this observes
# a release identity, never a build artifact. Site publication, the retained
# artifact and the deployed-site observation stay with `docs.yml`'s
# `main-build`, `rollback` and `smoke` jobs.
#
# Not verified live: no run of this workflow has executed. Workflow-run chaining
# (tag push -> "Release build" -> "Release publish" -> this file) and the exact
# API answers for the release/compare calls are `not_run` until an authorized
# live run; an absent artifact is never read as success or failure.

on:
  # A completed publish run. The workflow file is taken from the default branch,
  # so a tag cannot alter this observer, and only the run outcome is read.
  workflow_run:
    workflows: ["Release publish"]
    types: [completed]

# Baseline for every job; the single job restates its only scope.
permissions: {}

jobs:
  # ---------------------------------------------------------------------------
  # Observation reached by a completed publish run - read-only, no publication.
  # ---------------------------------------------------------------------------
  observe:
    name: Post-publish documentation observation (read-only, non-blocking)
    # Observe only a publish that concluded successfully. A failed or cancelled
    # publisher has no released revision to observe, and its own run already
    # carries the failure.
    if: github.event.workflow_run.conclusion == 'success'
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Resolve the released tag and commit (read-only)
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          # The latest release is the publication record this route observes.
          # Its tag is validated before any use, with the same strict pattern
          # `release-publish.yml` applies to the build run's branch: a branch
          # name, a shortened ref, a pre-release suffix or a decorated tag can
          # never become a checkout ref. The commit must be a full lowercase
          # SHA, and it must be reachable from the default branch, so a tag on a
          # side branch or an unrelated commit is refused rather than observed.
          # A rerun of an older publish therefore observes the latest release,
          # not that run's tag: the record keeps `source_run_id` next to the tag
          # so the pair stays readable, and it remains non-authoritative.
          if [[ ! "${DEFAULT_BRANCH:-}" =~ ^[A-Za-z0-9][A-Za-z0-9._/-]*$ ]] || [[ "$DEFAULT_BRANCH" == *..* ]]; then
            echo "::error::default branch name is missing or unsafe; refusing to observe"
            exit 1
          fi

          tag="$(gh api "repos/${GH_REPO}/releases/latest" --jq '.tag_name')" || {
            echo "::error::cannot read the latest release; refusing to observe"
            exit 1
          }
          # Character set first, so a multi-line or decorated value cannot pass
          # the anchored pattern below one line at a time.
          case "$tag" in
            *[!A-Za-z0-9._-]*)
              echo "::error::the latest release tag contains characters this observation will not use; refusing to observe"
              exit 1
              ;;
          esac
          if ! printf '%s' "$tag" | grep -Eq '^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$'; then
            echo "::error::the latest release tag is not a strict vX.Y.Z tag; refusing to observe"
            exit 1
          fi

          # A lightweight tag points straight at a commit; an annotated tag
          # points at a tag object that must be dereferenced once. Anything else
          # (tree, blob, another annotated layer) is not a published commit.
          object_type="$(gh api "repos/${GH_REPO}/git/ref/tags/${tag}" --jq '.object.type')" || {
            echo "::error::cannot read the tag ref for ${tag}; refusing to observe"
            exit 1
          }
          object_sha="$(gh api "repos/${GH_REPO}/git/ref/tags/${tag}" --jq '.object.sha')" || {
            echo "::error::cannot read the tag object for ${tag}; refusing to observe"
            exit 1
          }
          revision="$object_sha"
          if [ "$object_type" = "tag" ]; then
            revision="$(gh api "repos/${GH_REPO}/git/tags/${object_sha}" --jq '.object.sha')" || {
              echo "::error::cannot dereference annotated tag ${tag}; refusing to observe"
              exit 1
            }
            commit_type="$(gh api "repos/${GH_REPO}/git/tags/${object_sha}" --jq '.object.type')" || commit_type=""
          else
            commit_type="$object_type"
          fi
          if [ "$commit_type" != "commit" ]; then
            echo "::error::tag ${tag} does not resolve to a commit (${commit_type:-unknown}); refusing to observe"
            exit 1
          fi
          if [[ ! "$revision" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::tag ${tag} does not resolve to a full lowercase commit SHA; refusing to observe"
            exit 1
          fi

          # Ancestry from the same read-only API: comparing the released commit
          # as the base against the default branch reports `ahead` (or
          # `identical`) only when the released commit is an ancestor of the
          # default branch. `behind`, `diverged` or any error refuses.
          status="$(gh api "repos/${GH_REPO}/compare/${revision}...${DEFAULT_BRANCH}" --jq '.status')" || {
            echo "::error::cannot compare ${revision} with ${DEFAULT_BRANCH}; refusing to observe"
            exit 1
          }
          case "$status" in
            ahead|identical) ;;
            *)
              echo "::error::released commit ${revision} is not on the default branch ${DEFAULT_BRANCH} (${status:-unknown}); refusing to observe"
              exit 1
              ;;
          esac

          echo "RESOLVED_TAG=${tag}" >> "$GITHUB_ENV"
          echo "RESOLVED_REVISION=${revision}" >> "$GITHUB_ENV"
          echo "Released revision: ${tag} ${revision}"

      - name: Checkout the published revision
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4, same pin as ci.yml
        with:
          ref: ${{ env.RESOLVED_REVISION }}
          path: docs-trusted
          fetch-depth: 1
          submodules: false
          persist-credentials: false

      - name: Bind the observation to the published revision
        env:
          TRUSTED_DIR: ${{ github.workspace }}/docs-trusted
          REVISION: ${{ env.RESOLVED_REVISION }}
          OUT_DIR: ${{ runner.temp }}/docs-ci/observe
          HOME: ${{ runner.temp }}/docs-ci/home-observe
          GIT_CONFIG_NOSYSTEM: "1"
          GIT_CONFIG_GLOBAL: /dev/null
        run: |
          set -euo pipefail
          # Same binding record and refusal as `docs.yml`'s
          # `post-publish-observation` job: the record is written before the
          # verdict, so a mismatch is still evidence, and the step fails loudly
          # instead of recording an observation of a different source.
          install -d -m 0700 "$OUT_DIR" "$HOME"
          observed="$(git -C "$TRUSTED_DIR" rev-parse HEAD)"
          if [ "$observed" = "$REVISION" ]; then
            matched=true
          else
            matched=false
          fi
          printf '{"schema":"docs-observation-binding/1","expected_revision":"%s","observed_revision":"%s","matched":%s}\n' \
            "$REVISION" "$observed" "$matched" > "$OUT_DIR/binding.json"
          if [ "$matched" != "true" ]; then
            echo "::error::checked-out $observed does not match the published revision $REVISION; refusing to observe a different source"
            exit 1
          fi

      - name: Record the delivery route of this observation
        env:
          OUT_DIR: ${{ runner.temp }}/docs-ci/observe
          OBSERVATION_ROUTE: workflow-run
          OBSERVATION_DELIVERY: post-publish-run-event
          OBSERVATION_RUN_ID: ${{ github.run_id }}
          REVISION: ${{ env.RESOLVED_REVISION }}
          PUBLISHED_TAG: ${{ env.RESOLVED_TAG }}
          SOURCE_RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          set -euo pipefail
          # Same record schema, field set and refusal rules as `docs.yml`'s
          # `post-publish-observation` job. The values are revalidated here
          # because this step is the one that writes them.
          install -d -m 0700 "$OUT_DIR"
          # Every value below is interpolated into one single-line JSON record,
          # so a character outside the documented sets is refused before it can
          # break the record or smuggle a second line into it.
          case "$REVISION$OBSERVATION_RUN_ID$SOURCE_RUN_ID${PUBLISHED_TAG:-}" in
            *[!A-Za-z0-9._+-]*)
              echo "::error::an observation identifier contains a character this record will not store"
              exit 1
              ;;
          esac
          if ! printf '%s' "$REVISION" | grep -Eq '^[0-9a-f]{40}$'; then
            echo "::error::refusing to record a revision that is not a full commit SHA"
            exit 1
          fi
          if ! printf '%s' "$OBSERVATION_RUN_ID" | grep -Eq '^[0-9]{1,20}$'; then
            echo "::error::refusing to record a non-numeric observation run id"
            exit 1
          fi
          if ! printf '%s' "$SOURCE_RUN_ID" | grep -Eq '^[0-9]{1,20}$'; then
            echo "::error::refusing to record a non-numeric publish run id"
            exit 1
          fi
          tag="${PUBLISHED_TAG:-}"
          if ! printf '%s' "$tag" | grep -Eq '^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$'; then
            echo "::error::the released tag is not a strict vX.Y.Z tag this record will store"
            exit 1
          fi
          # `route: workflow-run` is the event that survives here: a completed
          # publish run is observed by a default-branch workflow file. Nothing
          # was built, downloaded or deployed, so `artifact_identity` says
          # plainly that no build artifact was inspected.
          printf '{"schema":"docs-observation-route/1","route":"%s","delivery":"%s","event":"workflow_run","revision":"%s","tag":"%s","source_run_id":"%s","observation_run_id":"%s","result":"observed","authoritative":false,"blocking_release":false,"artifact_identity":"not-inspected","source_binding":"binding.json"}\n' \
            "$OBSERVATION_ROUTE" "$OBSERVATION_DELIVERY" "$REVISION" "$tag" \
            "$SOURCE_RUN_ID" "$OBSERVATION_RUN_ID" > "$OUT_DIR/observation.json"

      - name: Upload post-publish observation evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4, same pin as ci.yml
        with:
          name: docs-post-publish-observation
          # Response only: `binding.json` is written before the verdict, so a
          # refused or mismatched source still leaves a record.
          path: ${{ runner.temp }}/docs-ci/observe
          if-no-files-found: warn
          retention-days: 7
