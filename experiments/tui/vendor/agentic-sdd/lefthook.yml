pre-commit:
  jobs:
    - name: gofmt
      glob: "*.go"
      run: |
        unformatted=$(gofmt -l {staged_files})
        if [ -n "$unformatted" ]; then
          printf 'Run gofmt on:\n%s\n' "$unformatted"
          exit 1
        fi
    - name: go-test
      run: task test
    - name: go-vet
      run: task vet
    - name: tui-vendor-check
      glob: "{*.go,experiments/tui/**,skills-files/**,opencode-pack/**}"
      run: task tui-vendor-check
    - name: whitespace
      run: git diff --cached --check
