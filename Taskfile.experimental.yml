version: '3'

vars:
  GOCACHE: '{{.GOCACHE | default (printf "%s/.cache/go-build" .ROOT_DIR)}}'

tasks:
  opencode-help:
    desc: Show inactive OpenCode helper usage
    cmds: ['GOCACHE={{.GOCACHE | shellQuote}} GOTOOLCHAIN=local GOPROXY=off GOSUMDB=off GOENV=off GOWORK=off go run -tags agentic_sdd_experimental ./cmd/agentic-sdd opencode --help']
  tui:test:
    desc: Run the experimental nested-module TUI tests (opt-in, requires Go 1.26 or newer)
    dir: '{{.ROOT_DIR}}/experiments/tui'
    cmds:
      - |
        sh -c '
        set -eu
        version=$(GOTOOLCHAIN=local go env GOVERSION)
        major=$(printf "%s" "$version" | sed -n "s/^go\([0-9][0-9]*\)\.\([0-9][0-9]*\).*/\1/p")
        minor=$(printf "%s" "$version" | sed -n "s/^go\([0-9][0-9]*\)\.\([0-9][0-9]*\).*/\2/p")
        if [ -z "$major" ] || [ -z "$minor" ]; then
          echo "tui:test: cannot parse Go version \"$version\"" >&2
          exit 2
        fi
        if [ "$major" -lt 1 ] || { [ "$major" -eq 1 ] && [ "$minor" -lt 26 ]; }; then
          echo "tui:test: SKIPPED - experiments/tui needs Go 1.26 or newer; found $version. A skip is not a pass." >&2
          exit 0
        fi
        GOCACHE="$1" GOTOOLCHAIN=local GOWORK=off GOFLAGS= go test -count=1 ./...
        ' sh {{.GOCACHE | shellQuote}}
  tui:run:
    desc: Interact with the experimental Charm v2 TUI catalog browser in a disposable temporary home
    interactive: true
    dir: '{{.ROOT_DIR}}/experiments/tui'
    cmds:
      - |
        sh -c '
        set -eu
        version=$(GOTOOLCHAIN=local go env GOVERSION)
        major=$(printf "%s" "$version" | sed -n "s/^go\([0-9][0-9]*\)\.\([0-9][0-9]*\).*/\1/p")
        minor=$(printf "%s" "$version" | sed -n "s/^go\([0-9][0-9]*\)\.\([0-9][0-9]*\).*/\2/p")
        if [ -z "$major" ] || [ -z "$minor" ]; then
          echo "tui:run: cannot parse Go version \"$version\"" >&2
          exit 2
        fi
        if [ "$major" -lt 1 ] || { [ "$major" -eq 1 ] && [ "$minor" -lt 26 ]; }; then
          echo "tui:run: requires Go 1.26 or newer; found $version" >&2
          exit 2
        fi
        umask 077
        demo_home=$(mktemp -d "${TMPDIR:-/tmp}/agentic-sdd-tui.XXXXXX") || exit 2
        trap "rm -rf -- \"$demo_home\"" EXIT INT TERM
        echo "Experimental TUI: running in a disposable home ($demo_home)..."
        AGENTIC_SDD_TUI=1 GOCACHE="$1" GOTOOLCHAIN=local GOWORK=off go run ./cmd/tui-spike --home "$demo_home"
        ' sh {{.GOCACHE | shellQuote}}
