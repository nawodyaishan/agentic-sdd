pre-commit:
  jobs:
    - name: gofmt
      glob: "*.go"
      run: |
        unformatted=$(gofmt -l {staged_files})
        if [ -n "$unformatted" ]; then
          printf 'Run gofmt on:\n%s\n' "$unformatted"
          exit 1
        fi
    - name: go-test
      run: make test
    - name: go-vet
      run: make vet
    - name: whitespace
      run: git diff --cached --check
