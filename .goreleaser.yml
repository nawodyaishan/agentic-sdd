version: 2

project_name: agentic-sdd

before:
  hooks:
    - go mod tidy

# Three separate applications. Never merge them into one fat binary:
#   cli-generic    - generic archive CLI, historical preview policy
#   cli-homebrew   - Homebrew-marked CLI, interactive zero-argument TUI default;
#                    its artifact name is the installed command name
#   tui-companion  - nested-module TUI binary, shared by both paired archives
# Every build injects the same shared buildinfo identity. Only the CLI's
# distribution marker differs; the companion stays generic and matches the CLI
# on revision, commit and source digest.
builds:
  - id: cli-generic
    main: ./cmd/agentic-sdd
    binary: agentic-sdd-generic
    env:
      - CGO_ENABLED=0
    goos:
      - darwin
    goarch:
      - amd64
      - arm64
    flags:
      - -trimpath
    mod_timestamp: "{{ .CommitTimestamp }}"
    ldflags:
      - >-
        -s -w
        -X agentic-sdd/internal/version.Version={{ .Version }}
        -X agentic-sdd/internal/version.Commit={{ .ShortCommit }}
        -X agentic-sdd/internal/version.Date={{ .Date }}
        -X agentic-sdd/internal/version.GoVersion={{ .Env.GOVERSION }}
        -X agentic-sdd/internal/buildinfo.Revision={{ .Version }}
        -X agentic-sdd/internal/buildinfo.Commit={{ .FullCommit }}
        -X agentic-sdd/internal/buildinfo.SourceDigest={{ if .Env.SDD_SOURCE_DIGEST }}{{ .Env.SDD_SOURCE_DIGEST }}{{ else }}git:{{ .FullCommit }}{{ end }}
        -X agentic-sdd/internal/buildinfo.DistributionMarker=generic

  - id: cli-homebrew
    main: ./cmd/agentic-sdd
    binary: agentic-sdd
    env:
      - CGO_ENABLED=0
    goos:
      - darwin
    goarch:
      - amd64
      - arm64
    flags:
      - -trimpath
    mod_timestamp: "{{ .CommitTimestamp }}"
    ldflags:
      - >-
        -s -w
        -X agentic-sdd/internal/version.Version={{ .Version }}
        -X agentic-sdd/internal/version.Commit={{ .ShortCommit }}
        -X agentic-sdd/internal/version.Date={{ .Date }}
        -X agentic-sdd/internal/version.GoVersion={{ .Env.GOVERSION }}
        -X agentic-sdd/internal/buildinfo.Revision={{ .Version }}
        -X agentic-sdd/internal/buildinfo.Commit={{ .FullCommit }}
        -X agentic-sdd/internal/buildinfo.SourceDigest={{ if .Env.SDD_SOURCE_DIGEST }}{{ .Env.SDD_SOURCE_DIGEST }}{{ else }}git:{{ .FullCommit }}{{ end }}
        -X agentic-sdd/internal/buildinfo.DistributionMarker=homebrew

  - id: tui-companion
    dir: experiments/tui
    main: ./cmd/tui-companion
    binary: agentic-sdd-tui
    env:
      - CGO_ENABLED=0
      # The nested module requires Go 1.26 or newer. Use the reviewed host
      # toolchain; never download one implicitly during a release build.
      - GOTOOLCHAIN=local
    goos:
      - darwin
    goarch:
      - amd64
      - arm64
    flags:
      - -trimpath
    mod_timestamp: "{{ .CommitTimestamp }}"
    ldflags:
      - >-
        -s -w
        -X agentic-sdd/internal/buildinfo.Revision={{ .Version }}
        -X agentic-sdd/internal/buildinfo.Commit={{ .FullCommit }}
        -X agentic-sdd/internal/buildinfo.SourceDigest={{ if .Env.SDD_SOURCE_DIGEST }}{{ .Env.SDD_SOURCE_DIGEST }}{{ else }}git:{{ .FullCommit }}{{ end }}
        -X agentic-sdd/internal/buildinfo.DistributionMarker=generic

# One universal entry per application: explicit input build IDs, replace the
# single-arch artifacts, and distinct output names so no application can be
# merged into another.
universal_binaries:
  - id: cli-generic-universal
    ids:
      - cli-generic
    replace: true
    name_template: agentic-sdd-generic
    mod_timestamp: "{{ .CommitTimestamp }}"
  - id: cli-homebrew-universal
    ids:
      - cli-homebrew
    replace: true
    name_template: agentic-sdd
    mod_timestamp: "{{ .CommitTimestamp }}"
  - id: tui-companion-universal
    ids:
      - tui-companion
    replace: true
    name_template: agentic-sdd-tui
    mod_timestamp: "{{ .CommitTimestamp }}"

# Two filtered paired archives with deterministic names. The same companion
# artifact is included in both; only the CLI build differs. The Homebrew cask
# consumes cli-homebrew-pair exclusively.
archives:
  - id: cli-generic-pair
    ids:
      - cli-generic-universal
      - tui-companion-universal
    formats:
      - tar.gz
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}_generic"
  - id: cli-homebrew-pair
    ids:
      - cli-homebrew-universal
      - tui-companion-universal
    formats:
      - tar.gz
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}_homebrew"

checksum:
  name_template: checksums.txt

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^ci:"
      - "^chore:"

# Prebuilt artifacts only: no source compilation, no install-time launch.
# The cask links the marked CLI as agentic-sdd and the companion as
# agentic-sdd-tui. Casks are quarantined by macOS; the binary is unsigned, so
# the post-install hook removes the quarantine bit from both executables.
# Signing/notarization is the alternative, but requires Apple credentials.
homebrew_casks:
  - name: agentic-sdd
    ids:
      - cli-homebrew-pair
    binaries:
      - agentic-sdd
      - agentic-sdd-tui
    repository:
      owner: nawodyaishan
      name: homebrew-tap
      token: "{{ .Env.HOMEBREW_TAP_TOKEN }}"
    directory: Casks
    homepage: "https://github.com/nawodyaishan/agentic-sdd"
    description: "Spec-driven development workflow skills, kept in sync across Codex, Claude Code, and Antigravity CLI"
    license: MIT
    hooks:
      post:
        install: |
          if OS.mac?
            system_command "/usr/bin/xattr", args: ["-dr", "com.apple.quarantine", "#{staged_path}/agentic-sdd"]
            system_command "/usr/bin/xattr", args: ["-dr", "com.apple.quarantine", "#{staged_path}/agentic-sdd-tui"]
          end
